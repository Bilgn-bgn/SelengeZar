<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SelengeZar - Сэлэнгийн зарын сайт</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="logo">Selenge<span>Zar</span></div><div class="search"><input id="q" placeholder="Хайх... утас, машин, байр..."><button class="btn" onclick="render()" style="padding:8px 14px">Хайх</button></div><button class="btn" onclick="openModal()">+ Зар оруулах</button></header>
<div class="wrap">
<h1 style="margin:6px 0 2px">Сэлэнгийн зарын сайт</h1><p style="color:#64748b;margin:0">Сүхбаатар, Сэлэнгэ — Зар оруулах үнэгүй</p>
<div class="cats" id="cats"></div>
<div class="status" id="status">Холбогдож байна...</div>
<div class="grid" id="grid"></div>
</div>
<div class="modal" id="modal"><div class="box">
<h2 style="margin:0">Шинэ зар оруулах</h2>
<input id="f-title" placeholder="Нэр *  жишээ: iPhone 13">
<input id="f-price" type="number" placeholder="Үнэ *  жишээ: 850000">
<select id="f-cat"><option>Утас</option><option>Машин</option><option>Байр</option><option>Тавилга</option><option>Хувцас</option><option>Бусад</option></select>
<input id="f-phone" placeholder="Утас  жишээ: 99110000">
<input id="f-loc" placeholder="Байршил  жишээ: Сүхбаатар, Сэлэнгэ">
<div class="upload"><div style="font-weight:800">📸 Зураг сонгох</div><div style="font-size:12px;color:#64748b">Утаснаасаа зураг сонгоно уу</div><input type="file" id="f-file" accept="image/*" style="margin-top:8px"><img id="f-preview"><div id="f-hint" style="font-size:12px;color:#64748b"></div></div>
<input id="f-img" placeholder="Эсвэл зурагны линк (заавал биш)">
<textarea id="f-desc" placeholder="Тайлбар"></textarea>
<div id="err" style="color:#dc2626;font-weight:700;font-size:13px"></div>
<button class="btn" id="pub" style="width:100%">Зар нийтлэх</button>
<button onclick="closeModal()" style="width:100%;margin-top:8px;padding:11px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;cursor:pointer">Хаах</button>
</div></div>
<script>
const URL="https://ocjpkwlkwtvqjpnwnfes.supabase.co";
const KEY="sb_publishable_ZIYp3CB6jyjXzaBxdQv1Dw_rpfE1s21";
const API=URL+"/rest/v1/ads";
let ads=[]; let curCat="Бүгд";
const CATS=["Бүгд","Утас","Машин","Байр","Тавилга","Хувцас","Бусад"];
function renderCats(){document.getElementById("cats").innerHTML=CATS.map(c=>`<button class="cat ${c===curCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");}
function setCat(c){curCat=c;renderCats();render();}
async function load(){try{const r=await fetch(API+"?select=*&order=created_at.desc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok) throw new Error("HTTP "+r.status);ads=await r.json();document.getElementById("status").textContent="✅ Supabase холбогдлоо. Нийт "+ads.length+" зар байна.";}catch(e){document.getElementById("status").textContent="⚠️ Supabase-д холбогдсонгүй: "+e.message;ads=[];}renderCats();render();}
function fmt(n){return Number(n||0).toLocaleString()+"₮"}
function render(){const q=document.getElementById("q").value.toLowerCase();const list=ads.filter(a=>(curCat==="Бүгд"||(a.cat||"Бусад")===curCat)&&(a.title||"").toLowerCase().includes(q));document.getElementById("grid").innerHTML=list.map(a=>`<div class="card"><img src="${a.img||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600'}"><div class="card-body"><div class="price">${fmt(a.price)}</div><h3>${a.title||''}</h3><div class="meta">${a.loc||''} • ${a.cat||''}</div><div><span class="phone">☎ ${a.phone||''}</span></div><div class="meta" style="margin-top:6px">${a.description||''}</div></div></div>`).join("")||"<p>Зар алга. + Зар оруулах дарж нэмээрэй.</p>";}
function openModal(){document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("f-file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const im=document.getElementById("f-preview");im.src=URL.createObjectURL(f);im.style.display="block";document.getElementById("f-hint").textContent="Зураг сонгогдлоо: "+f.name;});
document.getElementById("pub").onclick=async()=>{const title=document.getElementById("f-title").value.trim();const price=Number(document.getElementById("f-price").value);if(!title){document.getElementById("err").textContent="Нэрийг бичнэ үү";return}if(!price){document.getElementById("err").textContent="Үнийг бичнэ үү";return}document.getElementById("err").textContent="Зар оруулж байна...";let imgUrl=document.getElementById("f-img").value||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600";const file=document.getElementById("f-file").files[0];if(file){try{const fileName=Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await fetch(URL+"/storage/v1/object/ads-images/"+fileName,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":file.type},body:file});if(!up.ok) throw new Error(await up.text());imgUrl=URL+"/storage/v1/object/public/ads-images/"+fileName;}catch(e){document.getElementById("err").textContent="Зураг хуулахад алдаа: Supabase дээр ads-images bucket үүсгэсэн эсэхийг шалгаарай. "+e.message;return}}const body={title,price,cat:document.getElementById("f-cat").value,phone:document.getElementById("f-phone").value||"",loc:document.getElementById("f-loc").value||"Сүхбаатар, Сэлэнгэ",img:imgUrl,description:document.getElementById("f-desc").value||""};try{const r=await fetch(API,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(body)});if(!r.ok) throw new Error(await r.text());const data=await r.json();ads.unshift(data[0]);closeModal();render();alert("Зар Supabase-д хадгалагдлаа!");}catch(e){document.getElementById("err").textContent="Алдаа: "+e.message}};
load();
</script></body></html>
