<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SelengeZar - Сэлэнгийн зарын сайт</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Selenge<span>Zar</span></div>
  <div class="search">
    <input id="q" placeholder="Хайх... утас, машин, байр...">
    <button class="btn" onclick="render()">Хайх</button>
  </div>
  <button class="btn" onclick="openModal()">+ Зар оруулах</button>
</header>

<div class="wrap">

  <!-- HERO: зургийн гүйдэг слайд -->
  <section class="hero" id="hero">
    <div class="hero-track" id="heroTrack">
      <img src="zurag1.jpg" alt="">
      <img src="zurag2.jpg" alt="">
      <img src="zurag3.jpg" alt="">
      <img src="zurag4.jpg" alt="">
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <div class="cats" id="cats"></div>
  <div class="status" id="status">Холбогдож байна...</div>
  <div class="grid" id="grid"></div>
  <p class="foot">© 2026 SelengeZar • Сэлэнгэ, Сүхбаатар</p>
</div>

<!-- ЗАР ОРУУЛАХ ЦОНХ -->
<div class="modal" id="modal">
  <div class="box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>Шинэ зар оруулах</h2>
    <input id="f-title" placeholder="Нэр *">
    <input id="f-price" type="number" min="0" placeholder="Үнэ *">
    <select id="f-cat">
      <option>Утас</option><option>Машин</option><option>Байр</option>
      <option>Тавилга</option><option>Хувцас</option><option>Бусад</option>
    </select>
    <input id="f-phone" inputmode="tel" placeholder="Утас">
    <input id="f-loc" placeholder="Байршил - жишээ: Сүхбаатар, Сэлэнгэ">
    <div class="upload">
      <div class="upload-title">📸 Зураг сонгох</div>
      <div class="upload-hint">Утаснаасаа зураг сонгоно уу</div>
      <input type="file" id="f-file" accept="image/*">
      <img id="preview" alt="">
    </div>
    <textarea id="f-desc" placeholder="Тайлбар"></textarea>
    <div class="form-msg" id="err"></div>
    <button class="btn btn-block" id="publishBtn">Зар нийтлэх</button>
  </div>
</div>

<!-- ПРОФАЙЛ / НЭВТРЭХ ЦОНХ -->
<div class="modal" id="profileModal">
  <div class="box profile-box">
    <button class="modal-close" onclick="closeProfile()">✕</button>

    <!-- Нэвтрэх хэсэг -->
    <div id="login-view">
      <h2>Тавтай морил</h2>
      <p class="sub">Үргэлжлүүлэхийн тулд нэвтэрнэ үү</p>
      <button class="btn btn-block btn-light" onclick="loginWithGoogle()">G &nbsp; Google-ээр нэвтрэх</button>
      <button class="btn btn-block btn-fb btn-stack" onclick="loginWithFacebook()">f &nbsp; Facebook-ээр нэвтрэх</button>
      <div class="or">эсвэл</div>

      <div id="step-phone">
        <input id="login-phone" placeholder="Утасны дугаар" inputmode="numeric">
        <button class="btn btn-block btn-stack" onclick="sendCode()">Код явуулах</button>
      </div>
      <div id="step-code" style="display:none">
        <p class="sub"><b id="show-phone"></b> руу код илгээлээ</p>
        <input id="login-code" placeholder="6 оронтой код" inputmode="numeric" maxlength="6">
        <button class="btn btn-block btn-stack" onclick="verifyCode()">Нэвтрэх</button>
        <button class="btn btn-block btn-outline btn-stack" onclick="backToPhone()">Дугаар солих</button>
      </div>
      <div class="form-msg" id="login-err"></div>
    </div>

    <!-- Профайл хэсэг (нэвтэрсний дараа) -->
    <div id="profile-info" style="display:none">
      <div class="profile-head">
        <div class="avatar" id="profile-avatar">?</div>
        <div class="profile-name" id="profile-name">-</div>
        <div class="profile-email" id="profile-email"></div>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-profile-btn" onclick="showTab('profile')">Профайл</button>
        <button class="tab-btn" id="tab-settings-btn" onclick="showTab('settings')">Тохиргоо</button>
      </div>

      <div id="tab-profile">
        <div class="info-row"><span>Утас</span><b id="profile-phone">-</b></div>
        <div class="info-row"><span>Байршил</span><b id="profile-loc">-</b></div>
        <div class="info-row"><span>Бүртгүүлсэн</span><b id="profile-date">-</b></div>
      </div>

      <div id="tab-settings" style="display:none">
        <label for="set-name">Нэр</label>
        <input id="set-name" placeholder="Нэр">
        <label for="set-phone">Утас</label>
        <input id="set-phone" placeholder="Утас" inputmode="tel">
        <label for="set-loc">Байршил</label>
        <input id="set-loc" placeholder="Байршил">
        <div class="form-msg ok" id="settings-err"></div>
        <div class="settings-actions">
          <button class="btn" onclick="saveSettings()">Хадгалах</button>
          <button class="btn btn-danger" onclick="logout()">Гарах</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ДООД ТАЛЫН BAR -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="goHome(this)"><span>🏠</span><small>Нүүр</small></button>
  <button class="nav-item" onclick="goSaved(this)"><span>🔖</span><small>Хадгалсан</small></button>
  <button class="nav-item nav-add" onclick="openModal()"><span>+</span><small>Зар нэмэх</small></button>
  <button class="nav-item" onclick="goChat(this)"><span>💬</span><small>Чат</small></button>
  <button class="nav-item" onclick="goProfile(this)"><span>👤</span><small>Профайл</small></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
