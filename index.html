<script>
  const hero = document.getElementById('hero');
  const track = document.getElementById('heroTrack');
  const slides = track.querySelectorAll('img');
  const firstClone = slides[0].cloneNode(true);
  track.appendChild(firstClone);
  const dotsBox = document.getElementById('heroDots');
  let index = 0, timer = null, isHolding = false, startX = 0;

  slides.forEach((_, i) => {
    const b = document.createElement('button');
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.onclick = () => { goTo(i); restart(); };
    dotsBox.appendChild(b);
  });
  const dots = dotsBox.querySelectorAll('button');

  function update(){
    track.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  }
  function goTo(i){
  if(i >= slides.length){
    // Сүүлийн зурагнаас дараа нь: эхний зургийн хувийг зүүн тийшээ оруулж ирнэ
    index = slides.length;
    update();
    // Хөдөлгөөн дууссаны дараа чимээгүйхэн жинхэнэ эхний зураг руу шилжинэ
    setTimeout(() => {
      track.style.transition = 'none';
      index = 0;
      update();
      // Дараагийн хөдөлгөөнд transition-ийг буцааж асаана
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transition = 'transform 0.6s ease';
        });
      });
    }, 620);
    return;
  }
  index = i;
  update();}


  
  function start(){ stop(); timer = setInterval(() => { if(!isHolding) goTo(index + 1); }, 3000); }
  function stop(){ clearInterval(timer); }
  function restart(){ stop(); start(); }

  // Дараад барьвал зогсдог, тавивал гүйдэг
  hero.addEventListener('pointerdown', e => { isHolding = true; startX = e.clientX; hero.setPointerCapture(e.pointerId); });
  hero.addEventListener('pointerup', e => {
    isHolding = false;
    const diff = e.clientX - startX;
    if(diff < -50) goTo(index + 1);
    else if(diff > 50) goTo(index - 1)
    restart();
  });
  hero.addEventListener('pointercancel', () => { isHolding = false; });
  hero.addEventListener('pointerleave', () => { isHolding = false; });

  update();
  start();
</script>

async function compressImage(file){
  if(file.size < 500*1024) return file; // 500KB-аас бага бол шахахгүй
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const max = 1200; // хамгийн их тал нь 1200px болно
        if(w > max || h > max){
          const ratio = Math.min(max / w, max / h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob)=>{
          const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
          resolve(new File([blob], name, {type: "image/jpeg"}));
        }, "image/jpeg", 0.82); // 82% чанартай
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

<script>
function openProfile(){
  const isLoggedIn = localStorage.getItem("userEmail") || localStorage.getItem("userPhone");

  document.getElementById("tab-profile-btn").style.background = tab === 'profile' ? '#22c55e' : '#333';

    document.getElementById("set-name").value = localStorage.getItem("userName") || "";

    document.getElementById("set-loc").value = localStorage.getItem("userLoc") || "Сүхбаатар, Сэлэнгэ";

function formatPhone(p){
  p = p.replace(/\D/g,"");
  if(p.startsWith("976")) return "+"+p;
  if(p.startsWith("8") || p.startsWith("9")) return "+976"+p;
  return "+"+p;
}
async function sendCode(){
  const raw = document.getElementById("login-phone").value.trim();
  if(raw.length < 8){ document.getElementById("login-err").textContent="Дугаарыг бүтэн оруулна уу"; return; }
  const phone = formatPhone(raw);
  document.getElementById("login-err").textContent="Код явуулж байна...";
  const r = await fetch(SUPABASE_URL+"/auth/v1/otp",{
    method:"POST",
    headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json"},
    body: JSON.stringify({phone, channel:"sms"})
  });
  if(!r.ok){ document.getElementById("login-err").textContent="Алдаа: "+await r.text(); return; }
  document.getElementById("login-err").textContent="";
  document.getElementById("step-phone").style.display="none";
  document.getElementById("step-code").style.display="block";
  document.getElementById("show-phone").textContent=phone;
  localStorage.setItem("pendingPhone", phone);
}
async function verifyCode(){
  const phone = localStorage.getItem("pendingPhone");
  const token = document.getElementById("login-code").value.trim();
  if(token.length !== 6){ document.getElementById("login-err").textContent="6 оронтой кодыг оруулна уу"; return; }
  document.getElementById("login-err").textContent="Шалгаж байна...";
  const r = await fetch(SUPABASE_URL+"/auth/v1/verify",{
    method:"POST",
    headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json"},
    body: JSON.stringify({phone, token, type:"sms"})
  });
  const d = await r.json();

  if(!r.ok){ document.getElementById("login-err").textContent="Код буруу байна"; return; }
   if(d.access_token){
    const expires_at = Math.floor(Date.now()/1000) + (d.expires_in || 3600);
    const session = { access_token: d.access_token, refresh_token: d.refresh_token || "", expires_at, expires_in: d.expires_in || 3600, token_type: d.token_type || "bearer", user: d.user };
    localStorage.setItem("sb-ocjpkwlkwtvqjpnwnfes-auth-token", JSON.stringify(session));
    localStorage.setItem("userEmail", d.user?.email || "");
    localStorage.setItem("userName", d.user?.user_metadata?.full_name || d.user?.email || phone);
  }
  localStorage.setItem("userPhone", phone);

  showProfile(phone);
  alert("Амжилттай нэвтэрлээ!");
}

function backToPhone(){
  document.getElementById("step-code").style.display="none";
  document.getElementById("step-phone").style.display="block";
}
async function logout(){
  try{ await sbClient.auth.signOut(); }catch(e){}
  localStorage.removeItem("sb-ocjpkwlkwtvqjpnwnfes-auth-token");
  localStorage.removeItem("userEmail");
  localStorage.removeItem("userName");
  localStorage.removeItem("userPhone");
  document.getElementById("profile-info").style.display = "none";
  document.getElementById("login-view").style.display = "block";
  document.getElementById("step-phone").style.display = "block";
  document.getElementById("step-code").style.display = "none";
  closeProfile();
}
</script>
